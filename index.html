
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario de Deysi</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f0;
  color: #333;
  margin: 0;
  padding: 20px;
}
header {
  text-align: center;
  margin-bottom: 20px;
}
h1 { color: #42634b; }
input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 10px;
  margin-bottom: 18px;
}
#productos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 15px;
}
.producto {
  background: white;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 2px 6px #0001;
  text-decoration: none;
  color: #333;
  overflow-wrap: anywhere;
}
.producto img {
  width: 100%;
  height: 140px;
  object-fit: contain;
  background: #fff;
}
.producto h2 {
  font-size: 16px;
  margin: 10px 0 6px;
}
.detalle { font-size: 13px; color: #666; }
#mensaje { text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Inventario de Deysi</h1>
  <p>Busca y consulta tus artículos</p>
</header>

<main>
  <input id="buscador" type="search"
    placeholder="Buscar producto por nombre..."
    aria-label="Buscar producto">
  <p id="mensaje">Cargando productos...</p>
  <div id="productos"></div>
</main>

<script>
(async function () {
  const lista = document.getElementById("productos");
  const buscador = document.getElementById("buscador");
  const mensaje = document.getElementById("mensaje");

  try {
    const respuesta = await fetch("products.json");
    if (!respuesta.ok) throw new Error("No se pudo cargar la lista");

    const productos = await respuesta.json();

    function mostrar() {
      const busqueda = buscador.value.trim().toLowerCase();

      const filtrados = productos.filter(p =>
        String(p.name || "").toLowerCase().includes(busqueda) ||
        String(p.category || "").toLowerCase().includes(busqueda)
      );

      lista.replaceChildren();
      mensaje.textContent = filtrados.length
        ? "Productos encontrados: " + filtrados.length
        : "No se encontraron productos.";

      filtrados.forEach(p => {
        const tarjeta = document.createElement("a");
        tarjeta.className = "producto";
        tarjeta.href = "?id=" + encodeURIComponent(p.id);

        const foto = document.createElement("img");
        foto.src = p.image;
        foto.alt = p.name || "Producto";
        foto.loading = "lazy";
        foto.onerror = () => {
          foto.alt = "Fotografía no disponible";
          foto.style.display = "none";
        };

        const nombre = document.createElement("h2");
        nombre.textContent = p.name || "Artículo sin nombre";

        const categoria = document.createElement("p");
        categoria.className = "detalle";
        categoria.textContent = "Categoría: " + (p.category || "Sin categoría");

        const cantidad = document.createElement("p");
        cantidad.className = "detalle";
        cantidad.textContent = "Cantidad: " + (p.quantity ?? "No indicada");

        tarjeta.append(foto, nombre, categoria, cantidad);
        lista.appendChild(tarjeta);
      });
    }

    buscador.addEventListener("input", mostrar);
    mostrar();

  } catch (error) {
    mensaje.textContent =
      "No se pudieron cargar los productos. Revisa que products.json esté en el repositorio.";
  }
})();
</script>
</body>
</html>
