
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha del producto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f0;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 8px #0002;
    }
    h1 { color: #42634b; text-align: center; }
    img {
      display: block;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin: 15px auto;
    }
    p { line-height: 1.6; overflow-wrap: anywhere; }
    .etiqueta { font-weight: bold; }
    .error { text-align: center; }
  </style>
</head>
<body>
<main id="ficha">Cargando producto...</main>

<script>
(async function () {
  const ficha = document.getElementById("ficha");
  const id = new URLSearchParams(location.search).get("id");

  if (!id) {
    ficha.innerHTML =
      "<div class='error'><h1>Producto no indicado</h1>" +
      "<p>Escanea el código QR individual de un artículo.</p></div>";
    return;
  }

  try {
    const respuesta = await fetch("products.json");
    if (!respuesta.ok) throw new Error("No se pudo cargar la información");

    const productos = await respuesta.json();
    const producto = productos.find(p => String(p.id) === String(id));

    if (!producto) {
      ficha.textContent = "No se encontró este producto.";
      return;
    }

    ficha.replaceChildren();

    const titulo = document.createElement("h1");
    titulo.textContent = producto.name || "Artículo";
    ficha.appendChild(titulo);

    if (producto.image) {
      const imagen = document.createElement("img");
      imagen.src = producto.image;
      imagen.alt = producto.name || "Imagen del artículo";
      imagen.onerror = () => {
        imagen.remove();
        const aviso = document.createElement("p");
        aviso.textContent = "Imagen no disponible.";
        ficha.appendChild(aviso);
      };
      ficha.appendChild(imagen);
    }

    const campos = [
      ["Descripción", producto.description],
      ["Categoría", producto.category],
      ["Subunidad", producto.unit],
      ["Cantidad", producto.quantity],
      ["Fecha de caducidad", producto.expiration],
      ["Código del producto", producto.id]
    ];

    campos.forEach(([nombre, valor]) => {
      if (valor !== undefined && valor !== null &&
          String(valor).trim() !== "") {
        const parrafo = document.createElement("p");
        const etiqueta = document.createElement("span");
        etiqueta.className = "etiqueta";
        etiqueta.textContent = nombre + ": ";
        parrafo.append(etiqueta, document.createTextNode(String(valor)));
        ficha.appendChild(parrafo);
      }
    });
  } catch (error) {
    ficha.textContent =
      "No se pudo cargar el producto. Intenta de nuevo más tarde.";
  }
})();
</script>
</body>
</html>
